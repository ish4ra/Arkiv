<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Pinned text rendering for theme renders (render.mjs sets FONTCONFIG_FILE).
     Archive v1 binds its vendored Inter Display files with @font-face, but
     Chromium still takes hinting, antialiasing and subpixel settings from
     fontconfig. The archived references were rendered unhinted, in greyscale,
     without colour fringes; stock Linux defaults (slight hinting, RGB subpixel)
     change label pixels. The system configuration is read first, then these
     values are assigned, so they hold on every machine. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>

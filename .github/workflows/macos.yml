name: macOS foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    name: ${{ matrix.architecture }} development (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: universal
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ARKIV_ARCH: ${{ matrix.architecture }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      ARKIV_THEME_PUBLIC_ED_KEY: ${{ vars.ARKIV_THEME_PUBLIC_ED_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Monotonic development build number
        run: |
          (( GITHUB_RUN_ATTEMPT < 100 ))
          echo "ARKIV_BUILD_VERSION=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
      - name: Updater metadata regression tests
        run: |
          python3 tests/test_updates.py -v
          python3 tests/test_update_channel.py -v
      - name: Document icon registration, pixel identity and branding regressions
        run: python3 tests/test_document_icons.py -v
      - name: Document icon theme pipeline and publication-safety regressions
        run: python3 tests/test_document_icon_themes.py -v
      - name: Archive format and document-icon coverage regressions
        run: python3 tests/test_format_icon_coverage.py -v
      - name: CI reliability regressions (pipefail matching, PlugInKit retries)
        run: python3 tests/test_ci_reliability.py -v
      - name: Check for tracked signing material
        run: python3 scripts/check-update-secrets.py
      - name: Toolchain and backend
        run: |
          swift --version
          xcodebuild -version
          uname -m
      - name: Build pinned in-process 7z engine
        run: scripts/ci-check.sh sevenzip python3 scripts/build-sevenzip.py
      - name: Install independent AES ZIP test reader
        run: python3 -m pip install --target .build/aes-test-deps --require-hashes -r tests/requirements-aes.txt
      - name: Engine security and fixture tests
        run: scripts/ci-check.sh engine scripts/test-engine.sh
      - name: Finder extension metadata regression tests
        run: scripts/ci-check.sh finder-extension-tests python3 tests/test_finder_extension.py -v
      - name: File Services registration regression tests
        run: scripts/ci-check.sh services-tests python3 tests/test_finder_services.py -v
      - name: Plain 7z modification regressions
        run: scripts/ci-check.sh seven-add swift test --filter 'SevenZip(Addition|Deletion|Rename|Replacement)Tests' -Xlinker -L"$PWD/.build/sevenzip" -Xlinker -rpath -Xlinker "$PWD/.build/sevenzip"
      - name: ZIP replacement compatibility regression
        run: scripts/ci-check.sh zip-replacement swift test --filter ZIPReplacementTests -Xlinker -L"$PWD/.build/sevenzip" -Xlinker -rpath -Xlinker "$PWD/.build/sevenzip"
      - name: Native Delete confirmation regression
        env:
          # Symbolized backtrace if a test process crashes (diagnostic only).
          SWIFT_BACKTRACE: enable=yes,interactive=no,symbolicate=full
        run: scripts/ci-check.sh delete-confirmation swift test --filter BrowserWindowTests.testDeleteConfirmationCancellationRefreshAndSound -Xlinker -L"$PWD/.build/sevenzip" -Xlinker -rpath -Xlinker "$PWD/.build/sevenzip"
      - name: Native ZIP folder editing regressions
        run: scripts/ci-check.sh folder-edits swift test --filter 'BrowserWindowTests.test(Folder(Replacement|Update)|SelectedFileUpdate)' -Xlinker -L"$PWD/.build/sevenzip" -Xlinker -rpath -Xlinker "$PWD/.build/sevenzip"
      - name: Native Open, Quick Look and nested archive regressions
        run: scripts/ci-check.sh quick-look swift test --filter '(Archive(QuickLook|Open|OpenSession)Tests|NestedArchiveTests)' -Xlinker -L"$PWD/.build/sevenzip" -Xlinker -rpath -Xlinker "$PWD/.build/sevenzip"
      - name: Swift tests (native runner architecture)
        env:
          # Symbolized backtrace if a test process crashes (diagnostic only).
          SWIFT_BACKTRACE: enable=yes,interactive=no,symbolicate=full
        run: scripts/ci-check.sh swift swift test --parallel -Xlinker -L"$PWD/.build/sevenzip" -Xlinker -rpath -Xlinker "$PWD/.build/sevenzip"
      - name: Validate branding dimensions, transparency, and checksums
        run: |
          scripts/ci-check.sh branding swift branding/verify-assets.swift branding
          (cd branding && shasum -a 256 -c SHA256SUMS)
      - name: Build and verify development application
        run: scripts/ci-check.sh app scripts/build-app.sh
      - name: Genuine UI screenshots of the redesigned windows (headless CI rendering)
        env:
          ARKIV_UI_SCREENSHOTS: ${{ github.workspace }}/build/ui-screenshots
          ARKIV_APP: ${{ github.workspace }}/build/Arkiv.app
        run: scripts/ci-check.sh ui-screenshots swift test --filter UIScreenshotTests -Xlinker -L"$PWD/.build/sevenzip" -Xlinker -rpath -Xlinker "$PWD/.build/sevenzip"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Arkiv-${{ matrix.architecture }}-ui-screenshots
          path: build/ui-screenshots
          if-no-files-found: warn
      - name: Quick Look thumbnail prototype feasibility (informational; app copy on this runner only)
        # Builds prototypes/quicklook-thumbnail into a copy of build/Arkiv.app,
        # registers that copy on this ephemeral runner and asks qlmanage for
        # thumbnails. The shipped app, DMG and ZIP never contain the prototype.
        continue-on-error: true
        run: prototypes/quicklook-thumbnail/diagnose.sh build/Arkiv.app
      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: Arkiv-${{ matrix.architecture }}-quicklook-prototype-report
          path: |
            build/thumbnail-prototype/report
            build/thumbnail-prototype/*.txt
            build/thumbnail-prototype/*.log
          if-no-files-found: warn
      - name: Finder action URL delivery diagnostic (packaged app)
        run: scripts/ci-check.sh finder-handoff swift scripts/diagnose-finder-handoff.swift build/Arkiv.app
      - name: Finder Sync system registration diagnostic (packaged extension)
        run: scripts/ci-check.sh finder-plugin python3 scripts/diagnose-finder-extension.py build/Arkiv.app
      - name: System Services registration diagnostic (packaged app)
        run: scripts/ci-check.sh services python3 scripts/diagnose-finder-services.py build/Arkiv.app
      - name: Create, mount, and verify development DMG
        run: |
          python3 tests/test_dmg_packaging.py -v
          scripts/ci-check.sh dmg scripts/build-dmg.sh
      - name: Package ZIP alternative
        run: ditto -c -k --sequesterRsrc --keepParent build/Arkiv.app "build/Arkiv-${ARKIV_ARCH}.zip"
      - name: Document icon size report (informational, compared with main)
        # Measurement only: it never changes build outputs, so it cannot block the build.
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin main
          mkdir -p build/size-baseline
          git archive FETCH_HEAD Resources/DocumentIcons | tar -x -C build/size-baseline
          python3 scripts/measure-document-icons.py --label main --baseline build/size-baseline/Resources/DocumentIcons --app build/Arkiv.app --zip "build/Arkiv-${ARKIV_ARCH}.zip"
          rm -rf build/size-baseline
      - name: Extract actual packaged ZIP with Arkiv and verify app
        run: |
          ARKIV_PACKAGE_ZIP="$PWD/build/Arkiv-${ARKIV_ARCH}.zip" ARKIV_PACKAGE_OUTPUT="$PWD/build/extracted-package" scripts/ci-check.sh package-extract swift test --filter PackageExtractionTests -Xlinker -L"$PWD/.build/sevenzip" -Xlinker -rpath -Xlinker "$PWD/.build/sevenzip"
          python3 scripts/verify-extracted-package.py build/Arkiv.app build/extracted-package/Arkiv.app
          scripts/ci-check.sh extracted-app scripts/verify-app.sh build/extracted-package/Arkiv.app "$ARKIV_ARCH"
      - name: Deliver actual app ZIP through native file promise and verify
        run: |
          ARKIV_PROMISE_ZIP="$PWD/build/Arkiv-${ARKIV_ARCH}.zip" ARKIV_PROMISE_OUTPUT="$PWD/build/promised-package" scripts/ci-check.sh package-promise swift test --filter DragPackagePromiseTests -Xlinker -L"$PWD/.build/sevenzip" -Xlinker -rpath -Xlinker "$PWD/.build/sevenzip"
          python3 scripts/verify-extracted-package.py build/Arkiv.app build/promised-package/Arkiv.app
          scripts/ci-check.sh promised-app scripts/verify-app.sh build/promised-package/Arkiv.app "$ARKIV_ARCH"
      - name: Document icon coverage diagnostic (informational; throwaway-runner default-handler experiment)
        # Reports, per archive suffix, the type macOS assigns, Arkiv's declared icon, the
        # default handler and the icon Icon Services returns, then repeats the check with
        # Arkiv temporarily the default for ZIP and XZ on this ephemeral runner only.
        continue-on-error: true
        run: swift scripts/diagnose-document-icon-coverage.swift --app build/Arkiv.app --ci-default-handler-experiment
      - name: Validate update archive and appcast generation
        if: matrix.architecture == 'universal'
        run: |
          python3 scripts/update-feed.py build/Arkiv.app/Contents/Info.plist build/Arkiv-universal.zip build/appcast-draft.xml --draft
          python3 tests/test_update_signing.py
      - uses: actions/upload-artifact@v6
        with:
          name: Arkiv-${{ matrix.architecture }}-development-dmg
          path: |
            build/Arkiv-${{ matrix.architecture }}-development.dmg
            build/Arkiv-${{ matrix.architecture }}-development.dmg.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v6
        with:
          name: Arkiv-${{ matrix.architecture }}-development
          path: build/Arkiv-${{ matrix.architecture }}.zip
          if-no-files-found: error

  icon-optimization-reproducibility:
    # Design-time tooling check; nothing here is built into the app.
    name: Icon optimization reproducibility (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      # Build 26501's unoptimized Playwright renders of the refined Seal Dark icons.
      # Update this pin only together with an approved artwork change.
      SOURCE_RENDERS: 84320dfa4ba81522dd71c63beb046b0b656819ad
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned design-time optimizer (hash-locked)
        run: python -m pip install --require-hashes -r design/document-icons/requirements-optimize.txt
      - name: Reproduce committed icons byte-for-byte from build 26501 renders
        run: |
          git fetch --no-tags --depth=1 origin "$SOURCE_RENDERS"
          mkdir -p build/icon-renders
          git archive FETCH_HEAD Resources/DocumentIcons | tar -x -C build/icon-renders
          python design/document-icons/optimize.py --reproduce build/icon-renders/Resources/DocumentIcons

  publish-development-update:
    name: Publish signed development update
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-15
    permissions:
      contents: write
    concurrency:
      group: arkiv-development-feed
      cancel-in-progress: false
    env:
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      ARKIV_THEME_PUBLIC_ED_KEY: ${{ vars.ARKIV_THEME_PUBLIC_ED_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Check signing configuration
        id: signing
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          if [[ -n "$SPARKLE_PRIVATE_ED_KEY" && -n "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Signed update publishing skipped. Set SPARKLE_PRIVATE_ED_KEY secret and SPARKLE_PUBLIC_ED_KEY variable; regular builds remain available.'
          fi
      - uses: actions/download-artifact@v6
        if: steps.signing.outputs.configured == 'true'
        with:
          name: Arkiv-universal-development
          path: build
      - name: Resolve pinned Sparkle tools and verify payload
        if: steps.signing.outputs.configured == 'true'
        run: |
          (( GITHUB_RUN_ATTEMPT < 100 ))
          echo "ARKIV_BUILD_VERSION=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
          swift package resolve
          ditto -x -k build/Arkiv-universal.zip build
      - name: Verify and publish signed Universal update
        if: steps.signing.outputs.configured == 'true'
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          scripts/verify-app.sh build/Arkiv.app universal
          python3 scripts/publish-update.py

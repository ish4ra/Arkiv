name: Diagnose DMG verification
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Failed macOS job ID
        required: true
        type: string
permissions:
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read only native disk image diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$JOB_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$REPOSITORY/actions/jobs/$JOB_ID/logs" > "$RUNNER_TEMP/job.log"
          python3 - "$RUNNER_TEMP/job.log" <<'PY'
          import re, sys
          from pathlib import Path
          found = False
          for line in Path(sys.argv[1]).read_text(errors="replace").splitlines():
              # These messages contain native error text, never command environments.
              match = re.search(r'hdiutil: (?:verify|create|attach) failed - ([A-Za-z0-9 ()/.,:_-]{1,200})$', line)
              if match:
                  print("::error title=Native disk image diagnostic::" + match.group(0))
                  found = True
              for phrase in ["has no checksum", "checksum is INVALID", "checksum is invalid",
                             "No checksum", "no checksum", "Resource temporarily unavailable",
                             "Input/output error", "No space left on device"]:
                  if phrase in line:
                      print("::error title=Native disk image diagnostic::" + phrase)
                      found = True
          if not found:
              print("::error::No recognized native disk image diagnostic in job log.")
          PY
